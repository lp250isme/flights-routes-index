# Hourly: build the index and upload it only when it changed to Cloudflare R2 (shortlink-files/fl/routes-index.tsv.gz).
# 每小時建一次索引，跟線上那份不一樣才上傳 R2。需要 repo secret CLOUDFLARE_API_TOKEN（R2 寫入）；沒設就只建不傳。
# 選用 TDX_CLIENT_ID／TDX_CLIENT_SECRET：台灣班號標出飛哪幾天（TDX 定期航班表）。
name: daily
on:
  schedule:
    - cron: '17 * * * *'   # 每小時：VRS、TDX 有變才上傳
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test
      - id: build
        run: node build.mjs routes-index.tsv.gz
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - name: upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.build.outputs.changed == 'true'
        run: npx -y wrangler@4 r2 object put shortlink-files/fl/routes-index.tsv.gz --file routes-index.tsv.gz --content-type application/gzip --remote
