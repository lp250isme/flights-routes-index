# Every 3 hours: build the index and upload it only when it changed to Cloudflare R2 (shortlink-files/fl/routes-index.tsv.gz).
# 每 3 小時建一次索引，跟線上那份不一樣才上傳 R2。需要 repo secret CLOUDFLARE_API_TOKEN（R2 寫入）；沒設就只建不傳。
# 選用 TDX_CLIENT_ID／TDX_CLIENT_SECRET：台灣班號標出飛哪幾天（TDX 定期航班表）。
name: daily
on:
  schedule:
    - cron: '17 */3 * * *'   # 每 3 小時：VRS、TDX 有變才上傳
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node --test
      - id: build
        run: node build.mjs routes-index.tsv.gz
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - name: upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.build.outputs.changed == 'true'
        run: npx -y wrangler@4.168.0 r2 object put shortlink-files/fl/routes-index.tsv.gz --file routes-index.tsv.gz --content-type application/gzip --remote
  # 公開 repo 60 天沒 commit，GitHub 會停掉排程；每次跑完重新啟用一次重設計時（不用假 commit）。
  # 獨立成一個 job：只有這裡拿 actions: write，帶 Cloudflare token 的 build 拿不到。
  keepalive:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily.yml/enable
